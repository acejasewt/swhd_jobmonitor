name: Check Heidelberg Jobboerse

on:
  schedule:
    # 每 30 分鐘跑一次（UTC 時間；GitHub 免費排程可能會有幾分鐘延遲，屬正常現象）
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # 允許在 GitHub 網頁上手動點「Run workflow」測試

permissions:
  contents: write   # 需要寫入權限才能把 job_state.json commit 回 repo

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run job monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_monitor.py

      - name: Commit updated state file (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add job_state.json
          git diff --cached --quiet || git commit -m "Update job state [skip ci]"
          git push
